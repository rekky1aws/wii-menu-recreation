<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="../_style/header.css">
	<link rel="stylesheet" type="text/css" href="../_style/header.css">
	<link rel="stylesheet" type="text/css" href="../_style/common.css">
	<link rel="stylesheet" type="text/css" href="./style/polar_clock.css">
	<script src="../_script/header.js" type="text/javascript" charset="utf-8" defer></script>
	<script src="./script/polar_clock.js" type="text/javascript" charset="utf-8" defer></script>
	<script>
		// Add tailing / in url if missing to load css and js above 
		if (window.location.href.slice(-1) != '/') {
			window.location.replace(window.location.href+"/");
		}
	</script>
	<title>Polar Clock</title>
</head>
<body>
	<div id="clock-container">
		<svg width="350" height="350" id="clock">
			<circle
				id="months-arc"
				cx="175"
				cy="175"
				r="50"
				fill="none"
				stroke-linecap="round"
				stroke-width="20"
				stroke-dasharray="0%, 1000000"
				pathLength="12"
			/>
			<circle
				id="days-arc"
				cx="175"
				cy="175"
				r="75"
				fill="none"
				stroke-linecap="round"
				stroke-width="20"
				stroke-dasharray="0%, 200%"
				pathLength="31"
			/>
			<circle
				id="hours-arc"
				cx="175"
				cy="175"
				r="100"
				fill="none"
				stroke-linecap="round"
				stroke-width="20"
				stroke-dasharray="0%, 200%"
				pathLength="24"
			/>
			<circle
				id="minutes-arc"
				cx="175"
				cy="175"
				r="125"
				fill="none"
				stroke-linecap="round"
				stroke-width="20"
				stroke-dasharray="0%, 200%"
				pathLength="60"
			/>
			<circle
				id="seconds-arc"
				cx="175"
				cy="175"
				r="150"
				fill="none"
				stroke-linecap="round"
				stroke-width="20"
				stroke-dasharray="0%, 200%"
				pathLength="60"
			/>
		</svg>
	</div>
	<div id="digital">
		<div id="years-digit"></div>
		-
		<div id="months-digit"></div>
		-
		<div id="days-digit"></div>
		&nbsp;
		<div id="hours-digit"></div>
		:
		<div id="minutes-digit"></div>
		:
		<div id="seconds-digit"></div>
	</div>
	<div id="app-menu">
		TEST MENU LALALALALALA
		<ul>
			<li><a href="#">Lien 1</a></li>
			<li><a href="#">Lien 2</a></li>
			<li><a href="#">Lien 3</a></li>
			<li><a href="#">Lien 4</a></li>
		</ul>
	</div>
</body>
</html>
